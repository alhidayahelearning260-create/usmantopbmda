 ot-=dt;if(ot<=0){ot=.7+Math.random()*.8;obs.push({x:W+60,y:90+Math.random()*(H-220),r:26+Math.random()*20,b:Math.random()<.3})}
 for(const o of obs){o.x-=(320*v+(o.b?90:0))*dt;if(slow<=0&&Math.hypot(o.x-150,o.y-py)<o.r+22){slow=1.3;shake=.35;toast='Turbulence! Slowing down';tt=1.5}}
 obs=obs.filter(o=>o.x>-80);
 if(fp>=1){st='land';ph=0}
}
function flyDraw(){
 ctx.save();if(shake>0)ctx.translate((Math.random()-.5)*6,(Math.random()-.5)*6);sky();
 for(const c of cl)cloud(c.x,c.y,c.s,.75);
 for(const o of obs){if(o.b){ctx.fillStyle='#222';ctx.beginPath();ctx.moveTo(o.x-12,o.y);ctx.lineTo(o.x,o.y-8*Math.sin(t*18));ctx.lineTo(o.x+12,o.y);ctx.fill()}else{ctx.fillStyle='rgba(60,66,80,.9)';for(const [dx,dy,r] of [[0,0,1],[-22,8,.7],[22,6,.75],[0,-14,.7]]){ctx.beginPath();ctx.arc(o.x+dx,o.y+dy,o.r*r,0,7);ctx.fill()}}}
 plane(150,py,.9,((k.s||k.arrowdown)?.12:0)-((k.w||k.arrowup)?.12:0));
 if(bst){ctx.strokeStyle='rgba(255,255,255,.5)';ctx.lineWidth=2;for(let i=0;i<10;i++){const y=Math.random()*H,x=Math.random()*W;ctx.beginPath();ctx.moveTo(x,y);ctx.lineTo(x+90,y);ctx.stroke()}}
 ctx.restore();card();
 const bx=250,bw=360;ctx.fillStyle='rgba(10,14,20,.78)';rr(bx-60,8,bw+120,40,8);ctx.fillStyle='#3a4452';ctx.fillRect(bx,26,bw,3);ctx.fillStyle='#e0262b';ctx.fillRect(bx,26,bw*fp,3);
 ctx.fillStyle='#b8c2d1';ctx.font='9px system-ui,sans-serif';ctx.textAlign='center';ctx.fillText('KARACHI',bx,43);ctx.fillText('LISBON',bx+bw,43);plane(bx+bw*fp,22,.07,0);
 ctx.fillStyle='rgba(10,14,20,.78)';rr(W-148,8,140,44,8);ctx.fillStyle='#fff';ctx.textAlign='left';ctx.font='bold 13px system-ui,sans-serif';ctx.fillText(Math.round(fp*7000)+' km flown',W-138,28);ctx.fillStyle='#3da5ff';ctx.fillRect(W-138,38,120*bo/100,8);
 fmap();toastDraw();
}
function lift(dt){
 ph+=dt;t+=dt;const u=Math.min(1,ph/5);sky();for(let i=0;i<10;i++)cloud(((i*137+ph*80)%1000)*.9-100,30+R(i+9)*(H-60),.6+R(i+3),.7);
 const cx=W/2,cy=H*.78-ease2(u)*H*.45;pcar(cx,cy,1-u*.55,0);
 if(u>.25){const e=ease2((u-.25)/.75);plane(W+220-e*(W/2+220),H*.28,1.1-.2*e,0)}
 if(u>.9){ctx.fillStyle='rgba(255,255,255,'+(u-.9)*10+')';ctx.fillRect(0,0,W,H)}
 ctx.fillStyle='#fff';ctx.textAlign='center';ctx.font='bold 22px system-ui,sans-serif';ctx.fillText('PBMDA reached – flying to the plane…',W/2,60);card();
 if(ph>=5){st='fly';startFly();toast='Fly to Lisbon! ▲ ▼ climb and descend, avoid storms';tt=4}
}
const ease2=u=>u*u*(3-2*u);
function land(dt){
 ph+=dt;t+=dt;sky();for(let i=0;i<10;i++)cloud(((i*137+ph*160)%1000)*.9-100,30+R(i+9)*(H-60),.6+R(i+3),.7);
 const u=Math.min(1,ph/4.5);ctx.fillStyle='#8aa06a';ctx.fillRect(0,H-70,W,70);ctx.fillStyle='#555';ctx.fillRect(0,H-50,W,16);
 plane(W*.25+u*W*.4,120+ease2(u)*(H-230),1,.12*(1-u));
 ctx.fillStyle='#fff';ctx.textAlign='center';ctx.font='bold 24px system-ui,sans-serif';ctx.fillText('Landing in Lisbon, Portugal',W/2,60);card();
 if(ph>=4.5){cc='#e9edf2';cox=-W;load(1);ph=0;st='newcar'}
}
function newcar(dt){ph+=dt;t+=dt;cox=-W*Math.max(0,1-ph/2.2);tt-=dt;toast='Your new car has arrived!';tt=2;drive();card();toastDraw();if(ph>3.2){cox=0;toast=L.t.air;tt=3;st='drive'}}
function ov(){
 ctx.fillStyle='rgba(8,11,16,.86)';ctx.fillRect(0,0,W,H);ctx.textAlign='center';ctx.fillStyle='#fff';
 const X={start:['RACE TO PBMDA','Safoora → Millennium → U-turn → PBMDA Office → fly to Lisbon → Sir Faisal Home'],over:['CRASHED','Your car is wrecked. Try again!'],win:['YOU REACHED SIR FAISAL HOME','Total time '+t.toFixed(1)+'s · Driver HOI Usman']}[st];
 ctx.font='bold 34px system-ui,sans-serif';ctx.fillText(X[0],W/2,130);ctx.font='14px system-ui,sans-serif';ctx.fillStyle='#b8c2d1';ctx.fillText(X[1],W/2,160);
 ctx.fillStyle='#e0262b';rr(W/2-140,190,280,42,10);ctx.fillStyle='#fff';ctx.font='bold 15px system-ui,sans-serif';ctx.fillText((st==='start'?'TAP OR PRESS ENTER TO START':'TAP OR PRESS ENTER TO RETRY'),W/2,216);
 ctx.fillStyle='#8b96a8';ctx.font='12px system-ui,sans-serif';
 ['Driver: HOI Usman · Passenger changes: Faisal, Warjil, Sohail, Humaiyoon','Use the on-screen buttons on mobile, or W A S D / arrows + SPACE boost · hold S / ▼ when stopped to reverse','Avoid buses, trucks and rickshaws'].forEach((s,i)=>ctx.fillText(s,W/2,268+i*20))}
t=0;hp=100;bo=100;cd=0;shake=0;steer=0;bg=0;bst=false;brk=false;pass=0;cc='#15171c';cox=0;ph=0;tt=0;load(0);
let last=performance.now();
(function loop(n){const dt=Math.min(.05,(n-last)/1000);last=n;
 if(st==='drive'){update(dt);drive();hud()}
 else if(st==='lift')lift(dt);else if(st==='land')land(dt);else if(st==='newcar')newcar(dt);
 else if(st==='fly'){fly(dt);flyDraw()}
 else{if(!L)load(0);drive();ov()}
 snd();requestAnimationFrame(loop)})(last);
</script></body></html>
